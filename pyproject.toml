[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "conversation"
version = "0.1.0"
description = "Simulate multi-agent conversations using EDSL"
requires-python = ">=3.10"
dependencies = [
    "edsl",
    "requests>=2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
addopts = "--strict-markers -m 'not integration'"
testpaths = ["tests"]
markers = [
    "integration: tests that require credentials or external services",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["."]
include = ["conversation*"]
