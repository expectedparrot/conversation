[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "conversation"
version = "0.1.0"
description = "Simulate multi-agent conversations using EDSL"
requires-python = ">=3.10"
dependencies = [
    "edsl",
    "jinja2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["conversation*"]
